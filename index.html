<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chowk – Everyday goods from Pakistan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="bar">
<div class="logo">Chowk</div>
<div class="search"><input id="q" type="search" placeholder="Search products" aria-label="Search products"></div>
<button class="cartbtn" id="openCart" aria-label="Open cart">Cart<span id="count">0</span></button>
</div></header>

<main>
<section class="hero">
<h1>Everyday goods, picked by hand.</h1>
<p>Textiles, kitchen, snacks and stationery from makers across Pakistan. Prices in PKR.</p>
</section>
<div class="tools">
<div class="chips" id="chips" role="group" aria-label="Categories"></div>
<select id="sort" aria-label="Sort products">
<option value="def">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="az">Name: A to Z</option>
</select>
</div>
<div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer>Demo store – no real payments are taken.</footer>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
<div class="dh"><h2>Your cart</h2><button class="x" id="closeCart" aria-label="Close cart">&times;</button></div>
<div class="items" id="items"></div>
<div class="foot"><div class="tot"><span>Total</span><span id="total">Rs 0</span></div><button class="cta" id="checkout" disabled>Go to checkout</button></div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
<h2 id="mt">Checkout</h2>
<form id="form" novalidate>
<label for="nm">Full name</label><input id="nm" autocomplete="name">
<label for="ph">Phone</label><input id="ph" type="tel" autocomplete="tel" placeholder="03XX XXXXXXX">
<label for="ad">Delivery address</label><input id="ad" autocomplete="street-address">
<p class="err" id="err"></p>
<button class="cta" type="submit">Place order (cash on delivery)</button>
</form>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
